# XcodeGen spec for the iOS app. Regenerate with `xcodegen generate` and
# commit hpscan.xcodeproj together with this file. Target settings live here,
# not in Xcode.
name: hpscan
options:
  bundleIdPrefix: com.sinimed
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  xcodeVersion: "16.0"
packages:
  HPScanKit:
    path: Packages/HPScanKit
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    CODE_SIGN_STYLE: Automatic
    # Set your Apple Developer team here or in Xcode's Signing pane.
    DEVELOPMENT_TEAM: ""
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  hpscan:
    type: application
    platform: iOS
    sources:
      - path: hpscan
    dependencies:
      - package: HPScanKit
        product: HPScanKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sinimed.hpscan
        PRODUCT_NAME: hpscan
        INFOPLIST_FILE: hpscan/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SUPPORTS_MACCATALYST: NO
schemes:
  hpscan:
    build:
      targets:
        hpscan: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - package: HPScanKit/HPScanKitTests
